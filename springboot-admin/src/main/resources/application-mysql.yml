spring:
  sql:
    init:
      # 服务启动时执行 schema.sql 和 data.sql 初始化数据
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
      continue-on-error: true
  datasource:
    # MySQL 连接地址
    url: jdbc:mysql://192.168.50.53:3306/wx?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    # 数据库用户名
    username: wx
    # 数据库密码
    password: wx123
    # 数据库驱动
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 连接池最小空闲连接数
      minimum-idle: 5
      # 连接池最大连接数
      maximum-pool-size: 20
      # 连接超时时间
      connection-timeout: 30000
      # 空闲连接最大存活时间
      idle-timeout: 600000
      # 连接最大生命周期
      max-lifetime: 1800000
